<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Крупная клавиатура для тренировки печати">
  <meta name="theme-color" content="#4a90d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Печатай">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Печатай</title>
</head>
<body>
  <div class="app">
    <header class="text-area-wrapper">
      <div
        id="text-display"
        class="text-display"
        aria-label="Напечатанный текст"
        role="textbox"
        aria-readonly="true"
      ></div>
      <button id="clear-btn" class="clear-btn" type="button" aria-label="Очистить текст">
        Очистить
      </button>
    </header>

    <section class="keyboard" aria-label="Клавиатура">
      <div class="keyboard-row" data-row="1"></div>
      <div class="keyboard-row" data-row="2"></div>
      <div class="keyboard-row" data-row="3"></div>
      <div class="keyboard-row keyboard-row--bottom"></div>
    </section>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
